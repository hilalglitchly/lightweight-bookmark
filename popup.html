<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Bookmarks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h2>Bookmarks</h2>
                <button id="settingsBtn" class="icon-btn" title="Sematkan folder ini sebagai Halaman Utama">📌</button>
            </div>
            <input type="text" id="searchInput" placeholder="Cari bookmark..." autofocus>
            <div id="breadcrumb" class="breadcrumb"></div>
        </header>
        <main>
            <ul id="bookmarkList">
                <!-- Data bookmark akan dimasukkan ke sini melalui JavaScript -->
            </ul>
        </main>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" id="menuOpenNewTab">Buka di Tab Baru</div>
        <div class="context-menu-item context-menu-danger" id="menuDelete">Hapus</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
