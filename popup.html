<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Bookmarks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h2 title="Shortcut to open: Alt+B">Bookmarks</h2>
                <div class="header-actions">
                    <button id="addBookmarkBtn" class="icon-btn" title="Bookmark current tab">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    </button>
                    <button id="newFolderBtn" class="icon-btn" title="Create new folder (Alt+N)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M22 19A2 2 0 0119 22H5a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3H19a2 2 0 012 2Z"/></svg>
                    </button>
                    <button id="settingsBtn" class="icon-btn" title="Pin this folder as Home">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
                    </button>
                </div>
            </div>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search bookmarks..." autofocus>
            </div>
            <div id="breadcrumb" class="breadcrumb"></div>
        </header>
        <main>
            <ul id="bookmarkList">
                <!-- Bookmark data is injected here via JavaScript -->
            </ul>
        </main>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" id="menuOpenNewTab">Open in New Tab</div>
        <div class="context-menu-item" id="menuOpenAll">Open All in New Tabs</div>
        <div class="context-menu-item" id="menuNewFolder">New Subfolder</div>
        <div class="context-menu-item" id="menuRename">Rename</div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item context-menu-danger" id="menuDelete">Delete</div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <div class="modal-icon modal-icon-danger">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </div>
                <div class="modal-header-text">
                    <h3 id="deleteModalTitle" class="modal-title">Delete Bookmark?</h3>
                    <p id="deleteModalDesc" class="modal-desc">Are you sure you want to delete this bookmark?</p>
                </div>
            </div>
            <div class="modal-actions">
                <button id="deleteModalCancel" class="modal-btn modal-btn-secondary">Cancel</button>
                <button id="deleteModalConfirm" class="modal-btn modal-btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- New Folder Modal -->
    <div id="newFolderModal" class="modal-overlay" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <div class="modal-icon modal-icon-accent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10v6"/><path d="M9 13h6"/><path d="M22 19A2 2 0 0119 22H5a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3H19a2 2 0 012 2Z"/></svg>
                </div>
                <div class="modal-header-text">
                    <h3 class="modal-title">New Folder</h3>
                    <p id="newFolderLocation" class="modal-desc">In Bookmarks bar</p>
                </div>
            </div>
            <div class="modal-body">
                <input type="text" id="newFolderInput" class="modal-input" placeholder="Folder name" maxlength="100">
            </div>
            <div class="modal-actions">
                <button id="newFolderCancel" class="modal-btn modal-btn-secondary">Cancel</button>
                <button id="newFolderConfirm" class="modal-btn modal-btn-primary">Create</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="popup.js"></script>
</body>
</html>
