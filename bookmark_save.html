<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save Bookmark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            width: 380px;
            min-height: 300px;
            overflow: hidden;
        }

        .container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h2 svg { opacity: 0.7; }

        .tab-info {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .tab-title {
            font-size: 13px;
            font-weight: 500;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .tab-url {
            font-size: 11px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 6px;
        }

        .folder-tree {
            flex: 1;
            overflow-y: auto;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 6px;
            margin-bottom: 12px;
            min-height: 150px;
            max-height: 260px;
        }

        .folder-tree::-webkit-scrollbar { width: 6px; }
        .folder-tree::-webkit-scrollbar-track { background: transparent; }
        .folder-tree::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .folder-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
            user-select: none;
        }

        .folder-item:hover { background: #3a3a3a; }
        .folder-item.selected { background: #2563eb; color: #fff; }
        .folder-item.selected svg { color: #fff; }

        .folder-item svg {
            flex-shrink: 0;
            color: #aaa;
        }

        .folder-item .folder-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .folder-children {
            padding-left: 18px;
        }

        .folder-toggle {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            opacity: 0.5;
            transition: transform 0.15s, opacity 0.15s;
        }

        .folder-toggle:hover { opacity: 1; }
        .folder-toggle.expanded { transform: rotate(90deg); }
        .folder-toggle.empty { visibility: hidden; }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        button {
            padding: 7px 16px;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }

        .btn-cancel {
            background: #3a3a3a;
            color: #ccc;
        }
        .btn-cancel:hover { background: #444; }

        .btn-save {
            background: #2563eb;
            color: #fff;
        }
        .btn-save:hover { background: #1d4ed8; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            Save Bookmark
        </h2>

        <div class="tab-info">
            <div class="tab-title" id="tabTitle">Loading...</div>
            <div class="tab-url" id="tabUrl"></div>
        </div>

        <div class="folder-label">Choose folder</div>
        <div class="folder-tree" id="folderTree"></div>

        <div class="actions">
            <button class="btn-cancel" id="cancelBtn">Cancel</button>
            <button class="btn-save" id="saveBtn" disabled>Save</button>
        </div>
    </div>

    <script src="bookmark_save.js"></script>
</body>
</html>
